<!DOCTYPE html>
<html lang="ru" data-mode="hop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Двигающаяся пиктограмма</title>
  <style>
    :root {
      --body: #d87656;
      --hi: #f0a07a;
      --shade: #c25a42;
      --foot: #a84836;
      --eye: #140f0d;
      --ink: #241c18;
      --paper: #f3efe9;
      --card: #fff;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 28px;
      max-width: 46ch;
      color: #5c514b;
    }

    .scene {
      display: grid;
      place-items: center;
      padding: 72px 16px 28px;
    }

    .card {
      position: relative;
      width: min(440px, 100%);
      height: 168px;
      background: var(--card);
      border-radius: 28px;
      box-shadow:
        0 1px 0 rgb(255 255 255 / 80%) inset,
        0 12px 32px rgb(60 36 24 / 8%);
    }

    .perch {
      position: absolute;
      top: 0;
      left: 62%;
      translate: -50% -78%;
    }

    .check {
      position: absolute;
      left: calc(62% + 8px);
      top: 22px;
      width: 18px;
      height: 18px;
      color: #1b2430;
      translate: 0 0;
      scale: 1;
    }

    .hero {
      display: grid;
      place-items: center;
      padding: 64px 0 8px;
    }

    .actor {
      display: grid;
      justify-items: center;
      align-items: end;
    }

    .sprite,
    .shadow {
      grid-area: 1 / 1;
    }

    .sprite {
      translate: 0 0;
      rotate: 0deg;
      scale: 1 1;
      transform-origin: center bottom;
      animation: sit 2.6s ease-in-out infinite;
    }

    .sprite canvas {
      display: block;
      width: calc(var(--px) * var(--cols));
      height: calc(var(--px) * var(--rows));
      image-rendering: pixelated;
    }

    .perch .shadow { display: none; }

    .shadow {
      align-self: end;
      width: 58%;
      height: calc(var(--px) * 0.7);
      margin-bottom: calc(var(--px) * -0.15);
      border-radius: 50%;
      background: rgb(70 32 20 / 18%);
      translate: 0 0;
      scale: 1 1;
      animation: shade 2.6s ease-in-out infinite;
    }

    html[data-mode="hop"] .sprite {
      animation: hop 1.05s linear infinite;
    }

    html[data-mode="hop"] .shadow {
      animation: shade-hop 1.05s linear infinite;
    }

    html[data-mode="walk"] .sprite {
      animation: walk 0.72s linear infinite;
    }

    html[data-mode="walk"] .shadow {
      animation: shade 0.72s linear infinite;
    }

    html[data-mode="done"] .sprite {
      animation: nod 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 1 both;
      animation-timing-function: linear(
        0, 0.214 14.7%, 0.386 23.7%, 0.598 31.9%, 0.999 44.7%,
        0.807 52.6%, 0.762 56%, 0.747 59.4%, 0.758 62.4%,
        0.793 65.6%, 0.999 77.4%, 0.961 81.2%, 0.949 84.8%,
        0.956 88%, 0.993 95.5%, 1
      );
    }

    html[data-mode="done"] .check {
      animation: pop 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) both;
      animation-timing-function: linear(
        0, 0.214 14.7%, 0.386 23.7%, 0.598 31.9%, 0.999 44.7%,
        0.807 52.6%, 0.762 56%, 0.747 59.4%, 0.758 62.4%,
        0.793 65.6%, 0.999 77.4%, 0.961 81.2%, 0.949 84.8%,
        0.956 88%, 0.993 95.5%, 1
      );
    }

    html[data-mode="done"] .shadow {
      animation: none;
    }

    @keyframes sit {
      0%, 100% { translate: 0 0; scale: 1 1; }
      50% { translate: 0 calc(var(--px) * -0.45); scale: 1.03 0.97; }
    }

    @keyframes hop {
      0%, 100% { translate: 0 calc(var(--px) * 0.35); scale: 1.08 0.9; }
      28% { translate: 0 calc(var(--px) * -3.1); scale: 0.94 1.08; }
      46% { translate: 0 calc(var(--px) * -3.35); scale: 0.97 1.04; }
      68% { translate: 0 calc(var(--px) * 0.55); scale: 1.12 0.84; }
      80% { translate: 0 calc(var(--px) * -0.7); scale: 0.98 1.04; }
      90% { translate: 0 calc(var(--px) * 0.15); scale: 1.04 0.96; }
    }

    @keyframes walk {
      0%, 100% { translate: calc(var(--px) * -2.5) 0; rotate: -4deg; }
      50% { translate: calc(var(--px) * 2.5) 0; rotate: 4deg; }
    }

    @keyframes nod {
      from { translate: 0 calc(var(--px) * -1.4); rotate: -6deg; }
      to { translate: 0 0; rotate: 0deg; }
    }

    @keyframes shade {
      0%, 100% { scale: 1 1; opacity: 1; }
      50% { scale: 0.86 1; opacity: 0.75; }
    }

    @keyframes shade-hop {
      0%, 100% { scale: 1.15 1; opacity: 1; }
      28%, 46% { scale: 0.62 1; opacity: 0.45; }
      68% { scale: 1.25 1; opacity: 1; }
    }

    @keyframes pop {
      from { scale: 0.3; }
      to { scale: 1; }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    button {
      appearance: none;
      border: 1px solid #e2d9d1;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { border-color: #c9b8ae; }

    button:focus-visible {
      outline: 2px solid var(--body);
      outline-offset: 2px;
    }

    button[aria-pressed="true"] {
      background: var(--body);
      border-color: var(--body);
      color: #fff;
    }

    .status {
      min-height: 1.4em;
      margin: 14px 0 0;
      text-align: center;
      color: #6d625b;
      font-size: 0.92rem;
    }

    @media (prefers-reduced-motion: reduce) {
      html[data-mode] .sprite,
      html[data-mode] .shadow,
      html[data-mode="done"] .check {
        animation: none;
      }
    }

    html[data-paused="true"] .sprite,
    html[data-paused="true"] .shadow,
    html[data-paused="true"] .check {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <main>
    <h1>Пиктограмма, которая двигается</h1>
    <p class="lead">Пиксельный персонаж, как на скриншоте: сидит на уголке готовой задачи, моргает, дышит, прыгает и переступает ножками.</p>

    <section class="scene" aria-label="Как на карточке в интерфейсе">
      <div class="card">
        <div class="perch">
          <div class="actor">
            <div class="sprite" data-px="2"></div>
            <div class="shadow" style="--px: 3px"></div>
          </div>
        </div>
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12.5 9.2 18 20 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <section class="hero" aria-label="Крупный вид">
      <div class="actor">
        <div class="sprite" data-px="16"></div>
        <div class="shadow" style="--px: 16px"></div>
      </div>
    </section>

    <div class="controls" role="group" aria-label="Движение">
      <button type="button" data-mode="sit">Сидит</button>
      <button type="button" data-mode="hop" aria-pressed="true">Прыгает</button>
      <button type="button" data-mode="walk">Ходит</button>
      <button type="button" data-mode="done">Готово</button>
      <button type="button" id="pause" aria-pressed="false">Пауза</button>
    </div>
    <p class="status" id="status">Сейчас подпрыгивает на месте.</p>
  </main>
  <script>
    const ROWS = [
      ".................",
      "...hhhhhhhhhhh...",
      "...bbEbbbbbEbb...",
      ".bbbbbbbbbbbbbbb.",
      "bbbbbbbbbbbbbbbbb",
      "bbbbbbbbbbbbbbbbb",
      "...bbbbbbbbbbb...",
      "...bbbbbbbbbbb...",
      "...sssssssssss...",
      ".....dd...dd.....",
      ".....dd...dd.....",
    ];

    const COLORS = {
      h: "#f0a07a",
      b: "#d87656",
      s: "#c25a42",
      d: "#a84836",
      E: "#140f0d",
    };

    const width = ROWS[0].length;
    const height = ROWS.length;
    ROWS.forEach((row) => {
      if (row.length !== width) throw new Error("кривая строка спрайта");
    });

    function pose(liftL, liftR, blink) {
      const grid = ROWS.map((row) => [...row]);
      const feet = [];
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (grid[y][x] === "d") {
            feet.push([x, y]);
            grid[y][x] = ".";
          }
        }
      }
      for (const [x, y] of feet) {
        const ny = y - (x < width / 2 ? liftL : liftR);
        if (ny >= 0) grid[ny][x] = "d";
      }
      if (blink) {
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            if (grid[y][x] === "E") grid[y][x] = "b";
          }
        }
      }
      return grid;
    }

    function paint(ctx, grid) {
      ctx.clearRect(0, 0, width, height);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const color = COLORS[grid[y][x]];
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    const canvases = [...document.querySelectorAll(".sprite")].map((sprite) => {
      sprite.style.setProperty("--px", sprite.dataset.px + "px");
      sprite.style.setProperty("--cols", String(width));
      sprite.style.setProperty("--rows", String(height));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      sprite.append(canvas);
      return canvas.getContext("2d");
    });

    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let stamp = "";

    function frameAt(now) {
      const paused = document.documentElement.dataset.paused === "true" || motionQuery.matches;
      if (paused) return pose(0, 0, false);
      const blinkAt = now % 4400;
      const blink = (blinkAt > 3916 && blinkAt < 4004) || (blinkAt > 4180 && blinkAt < 4268);
      const walking = document.documentElement.dataset.mode === "walk";
      const step = walking ? Math.floor(now / 360) % 2 : -1;
      return pose(step === 0 ? 1 : 0, step === 1 ? 1 : 0, blink);
    }

    function draw(now) {
      const grid = frameAt(now);
      const next = grid.map((row) => row.join("")).join("\n");
      if (next !== stamp) {
        stamp = next;
        for (const ctx of canvases) paint(ctx, grid);
      }
      requestAnimationFrame(draw);
    }

    draw(performance.now());

    const notes = {
      sit: "Сидит и чуть дышит, иногда моргает.",
      hop: "Сейчас подпрыгивает на месте.",
      walk: "Переступает ножками и покачивается.",
      done: "Кивает: задача готова.",
    };

    const status = document.getElementById("status");
    const root = document.documentElement;

    document.querySelectorAll("button[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.dataset.mode;
        root.dataset.mode = mode;
        root.dataset.paused = "false";
        document.getElementById("pause").setAttribute("aria-pressed", "false");
        document.getElementById("pause").textContent = "Пауза";
        document.querySelectorAll("button[data-mode]").forEach((other) => {
          other.setAttribute("aria-pressed", other === button ? "true" : "false");
        });
        if (mode === "done") {
          document.querySelectorAll(".check, .sprite").forEach((el) => {
            el.style.animation = "none";
            void el.offsetWidth;
            el.style.animation = "";
          });
        }
        status.textContent = notes[mode];
      });
    });

    document.getElementById("pause").addEventListener("click", () => {
      const paused = root.dataset.paused === "true";
      root.dataset.paused = paused ? "false" : "true";
      const pause = document.getElementById("pause");
      pause.setAttribute("aria-pressed", paused ? "false" : "true");
      pause.textContent = paused ? "Пауза" : "Дальше";
      status.textContent = paused ? notes[root.dataset.mode] : "На паузе.";
    });
  </script>
</body>
</html>
